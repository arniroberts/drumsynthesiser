name: Build Windows exe
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy sounddevice pyinstaller
      - run: pyinstaller --onefile --windowed --name DrumSynth --collect-all sounddevice drum_synth.py
      - uses: actions/upload-artifact@v4
        with:
          name: DrumSynth-windows
          path: dist/DrumSynth.exe
